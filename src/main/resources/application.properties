spring.application.name=coaching-app
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coachpro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:4444}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload limit for OCR
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.port=${PORT:8080}

# Tesseract
tesseract.data.path=${TESSERACT_DATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
gemini.api.key=${GEMINI_API_KEY}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}
