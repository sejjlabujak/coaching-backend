spring.application.name=coaching-app
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload limit for OCR
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.port=${PORT:8080}

# Tesseract
tesseract.data.path=${TESSERACT_DATA_PATH:/usr/local/share/tessdata}
gemini.api.key=${GEMINI_API_KEY}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Load local overrides if present (development only)
spring.config.import=optional:file:application-local.properties

